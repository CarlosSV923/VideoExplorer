# VideoExplorer on TrueNAS SCALE. Update the pinned version when installing a release.
services:
  videoexplorer:
    image: ghcr.io/carlossv923/videoexplorer:1.0.0
    restart: unless-stopped
    # Example UID:GID. Grant this user an inherited Modify ACL on both datasets;
    # no PUID/PGID variables are used. See README.md.
    user: '3000:3000'
    ports:
      - '8080:8080'
    volumes:
      # Library dataset, including Movies/, TV Shows/, _unassigned/ and
      # .videoexplorer/ (staging, trash and operation scratch) on the same dataset.
      - /mnt/POOL/media:/library
      # Separate app state dataset: SQLite and image cache.
      - /mnt/POOL/apps/videoexplorer:/data
    environment:
      PORT: '8080'
      LOG_LEVEL: info
      LIBRARY_PATH: /library # required
      DATA_PATH: /data # required; must be writable at startup
      MOVIES_DIR: Movies
      SERIES_DIR: 'TV Shows'
      # Set exactly one password option. Prefer APP_PASSWORD_HASH, generated by
      # `task hash-password`. Double every $ as $$ so Compose keeps it literally.
      APP_PASSWORD_HASH: '$$argon2id$$v=19$$REPLACE_WITH_HASH_FROM_TASK'
      # APP_PASSWORD: 'replace-with-a-long-password' # alternative to hash; keep secret
      SESSION_SECRET: 'REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_BYTES' # required
      SESSION_TTL: 720h
      COOKIE_SECURE: 'false' # default; set true only when served over HTTPS
      # TMDB_API_KEY: '' # optional; alternatively TMDB_READ_TOKEN, never both
      # TMDB_READ_TOKEN: '' # optional
      TMDB_LANGUAGE: es-MX
      # Jellyfin is optional: configure URL and key together, or leave both unset.
      # JELLYFIN_URL: ''
      # JELLYFIN_API_KEY: ''
      # JELLYFIN_LIBRARY_PATH: '' # optional; path Jellyfin uses for /library
      TRASH_RETENTION_DAYS: '30'
      EXTRACT_CONCURRENCY: '1'
      UNASSIGNED_SCAN_INTERVAL: 30m
      LIBRARY_SCAN_INTERVAL: 6h
      VIDEO_EXTENSIONS: .mkv,.mp4,.avi,.m4v,.ts,.m2ts,.mov,.wmv,.webm,.mpg,.mpeg
      SUBTITLE_EXTENSIONS: .srt,.ass,.ssa,.sub,.idx,.vtt
    # The Dockerfile HEALTHCHECK (GET /api/health) is inherited by this service.
