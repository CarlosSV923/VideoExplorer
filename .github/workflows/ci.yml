name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same pinned image as REDOCLY_IMAGE in Taskfile.yml (`task lint:openapi`).
      - name: Redocly lint
        run: docker run --rm -v "$PWD:/spec" -w /spec redocly/cli:2.62.1 lint --config api/redocly.yaml api/openapi.yaml

  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      # Same installers as the dev image (deploy/dev/Dockerfile): pinned versions, SHA-256 checked.
      - name: Install official 7-Zip (with RAR) and ffprobe (used by integration tests)
        working-directory: .
        run: sudo sh scripts/install-7zip.sh && sudo sh scripts/install-ffprobe.sh
      - name: Require 7-Zip and ffprobe in tests
        run: |
          echo "REQUIRE_7ZZ=1" >> "$GITHUB_ENV"
          echo "REQUIRE_FFPROBE=1" >> "$GITHUB_ENV"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: apps/api
      - name: Test
        run: go test -race -timeout 300s ./...
      - name: Vulnerability check
        # Same pinned version as GOVULNCHECK_VERSION in Taskfile.yml (`task vuln`).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build
        run: go build -o bin/videoexplorer ./cmd/videoexplorer

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same tool version as the go.mod tool directive (`task gen:api`).
      - name: oapi-codegen (Go server types)
        working-directory: apps/api/internal/platform/httpapi
        run: go tool oapi-codegen -config oapi-codegen.yaml ../../../../../api/openapi.yaml
      # Same pinned image as SQLC_IMAGE in Taskfile.yml (`task gen:sql`).
      - name: sqlc (typed queries)
        run: docker run --rm -v "$PWD/apps/api:/src" -w /src sqlc/sqlc:1.31.1 generate
      - name: openapi-typescript (TS client types)
        run: pnpm gen:web
      - name: Fail if anything changed
        run: |
          test -z "$(git status --porcelain)" || { echo "::error::Generated code is stale. Run 'task gen' and commit."; git status --porcelain; git diff; exit 1; }

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm format:check
      - run: pnpm test:web
      - name: Build
        run: pnpm build:web
      - name: Build (demo mode)
        run: pnpm build:web
        env:
          VITE_DATA_SOURCE: demo

  e2e:
    name: E2E (demo)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @videoexplorer/web exec playwright install chromium
      - name: Build demo and run desktop and mobile E2E
        run: pnpm e2e:web
        env:
          HOME: /root
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
