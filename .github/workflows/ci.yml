name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same pinned image as REDOCLY_IMAGE in Taskfile.yml (`task lint:openapi`).
      - name: Redocly lint
        run: docker run --rm -v "$PWD:/spec" -w /spec redocly/cli:2.62.1 lint --config api/redocly.yaml api/openapi.yaml

  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          # No go.sum until the first external dependency (phase 1); re-enable the cache then.
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: apps/api
      - name: Test
        run: go test -race -timeout 120s ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build
        run: go build -o bin/videoexplorer ./cmd/videoexplorer

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm format:check
      - run: pnpm test:web
      - name: Build
        run: pnpm build:web
