openapi: 3.0.3
info:
  title: VideoExplorer API
  version: 0.0.0
  description: |
    Single source of truth for the VideoExplorer HTTP contract.
    Go handlers (oapi-codegen strict server) and the TypeScript client
    (openapi-typescript) are generated from this file from phase 1 on; never
    edit generated code.

    This file describes only the endpoints that are implemented; the rest are
    added as they are built.

    Every operation requires the session cookie (`ve_session`) unless it
    declares `security: []`: only `/health` and `/auth/login` are public
    (RF-60, RNF-02). Errors use RFC 9457 problem details.

    Uploads are NOT described here: they use the tus resumable upload protocol
    (https://tus.io/protocols/resumable-upload) mounted at /api/uploads/, behind
    the same session cookie (RF-02, RF-60). Upload-Length is required: the size
    is declared up front. Upload-Metadata keys: `filename` (required, the file
    name without folders), `relativePath` (optional, the file's path inside a
    folder dropped in the browser, ending with `filename`, RF-01a) and `batchId`
    (required, the id that `POST /batches` returned for the files dropped
    together, RF-03, RF-09a) and `partsTotal` (required for a volume of a multi-volume
    archive, `.partN.rar`, `.7z.001`, `.zip.001`…, and refused for any other file:
    how many volumes the browser counted for that set among the files dropped together,
    an integer from 2 to 999, RF-03). Names are trimmed; separators, `.`, `..` and
    control characters are refused. Refusals: 400 for bad metadata, a missing
    `batchId` or one that names no batch (`ERR_INVALID_METADATA`), 400 for a
    0-byte file
    (`ERR_EMPTY_FILE`, RF-09a), 507 when the library has no room for the file
    plus 1 GiB, counting the bytes still to arrive from uploads in progress
    (`ERR_INSUFFICIENT_STORAGE`, RF-05, RF-09a); 503 when the library is not
    writable (RFC 9457 problem). The upload id given in `Location` is the id of
    its job (`GET /jobs`, RF-10a).
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: /api
tags:
  - name: system
    description: Process-level endpoints, such as the liveness probe.
  - name: auth
    description: Sign-in with the shared password and the session cookie.
  - name: images
    description: Title images (posters, backdrops, logos, stills) from the local cache.
  - name: ingestion
    description: Upload batches, the files dropped together in the browser (RF-03), and the state of each upload (RF-10a, RF-10b).
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe and startup diagnostics
      description: |
        Always answers 200 while the process is up. It runs the diagnostics of
        RF-63 on every request: the library and data folders must accept a
        file written and removed by this process, and the external programs
        `7zz` and `ffprobe` must be in the PATH and start. When a check fails,
        `status` becomes `degraded` so the UI can explain the problem instead
        of the container crash-looping. TMDB is not checked.
      security: []
      responses:
        '200':
          description: The process is up.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session with the shared password
      description: |
        Checks the shared password and sets the session cookie. Attempts are
        rate limited per client address: a burst of 5, then one more every 12 s.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Session started; the cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session on this device
      responses:
        '204':
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session
      responses:
        '200':
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /batches:
    post:
      tags: [ingestion]
      operationId: createBatch
      summary: Start a batch of files dropped together
      description: |
        Creates the batch that the files dropped together share and returns its
        id (RF-03). The browser calls it before the first upload of the batch and
        sends the id as `batchId` in the Upload-Metadata of each upload (see the
        description of the API for the uploads). A single file is sent with
        `relation: none` without asking the user (RF-03).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '201':
          description: The batch was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs:
    get:
      tags: [ingestion]
      operationId: listJobs
      summary: Most recent upload jobs
      description: |
        The 100 most recent upload jobs, newest first, each with its batch
        (RF-10b). A job is one file the browser uploaded (RF-10a). These are the
        same objects the event stream sends (`/jobs/events`).
      responses:
        '200':
          description: The jobs, newest first; at most 100.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/events:
    get:
      tags: [ingestion]
      operationId: streamJobEvents
      summary: Live upload job changes (server-sent events, RF-10b)
      description: |
        `text/event-stream`, one event for each change of a job's state or
        progress. Every event is named `job` and its `data` line holds one
        UploadJob JSON object with the whole state of the job:

        ```
        event: job
        data: {"id":"3kQ7Zr1xVb8mNcT2pL0aWq","status":"uploading","received":1048576,...}

        ```

        On connect the server sends one `job` event for each job that `GET /jobs`
        would return, then streams the changes. Progress-only events of one job
        are limited to about two per second; a change of status or failure reason
        is never dropped. A client that falls too far behind is disconnected, and
        its `EventSource` reconnects and receives the snapshot again. A comment
        line (`: ping`) is sent every 25 seconds to keep proxies from closing the
        connection. The stream ends when the server shuts down.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/{id}/password:
    post:
      tags: [ingestion]
      operationId: submitJobPassword
      summary: Send the password of an encrypted archive
      description: |
        Sends the password of an archive whose job waits in `needs_password`
        (RF-04). The password is used to open the archive and is never stored
        or logged. The job goes back to `extracting`; when the password does not
        open the archive, the job stays in `needs_password` with
        `error: wrong_password` (RF-10c). Answers 409 when the job is not waiting
        for a password.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '202':
          description: The password was queued; the job is extracted or asks again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /jobs/{id}/retry:
    post:
      tags: [ingestion]
      operationId: retryJob
      summary: Retry an extraction that failed for a retryable reason
      description: |
        Retries the extraction of a job that failed with `no_space`,
        `archive_corrupt` or `crc_mismatch` (RF-10c). The archive is still in
        staging and the extracted files of the failed attempt are deleted first.
        The job goes back to `extracting`. Answers 409 for any other job, or when
        its archive is no longer there.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: The retry was queued; the job is `extracting` again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /images/{kind}/{file}:
    get:
      tags: [images]
      operationId: getImage
      summary: Title image served from the local cache
      description: |
        A poster, backdrop, logo or episode still of TMDB. The file is downloaded
        from TMDB's image CDN on first use, at the size that spec §6 sets for its
        kind, and kept under DATA_PATH/cache/images. The browser never contacts
        TMDB (RNF-10). Images do not expire. Without TMDB configured, only the
        images already cached are served; the others answer 404.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImageKind'
        - name: file
          in: path
          required: true
          description: File name of the TMDB image path, without its leading slash.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,128}\.(jpe?g|png)$'
            example: 9ZmWNo1wq1y9vSIt7iGlVAtsgXB.jpg
      responses:
        '200':
          description: The image. Range and conditional requests are honoured.
          headers:
            Cache-Control:
              description: Exception to RNF-02 for images (RNF-02, §6).
              schema:
                type: string
                enum: ['private, max-age=2592000, immutable']
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ve_session

  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: Job id, the id of its tus upload (`GET /jobs`).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
  responses:
    Unauthorized:
      description: Missing, invalid or expired session, or wrong password.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many login attempts from this client; retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request does not name a valid resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource is not available, and TMDB cannot provide it either.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource is in a state that does not allow the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: The image is not cached and TMDB could not provide it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ImageKind:
      type: string
      description: |
        Kind of title image. Each kind has the TMDB size of spec §6: poster w500,
        backdrop w1280, logo w500, still w300.
      enum: [poster, backdrop, logo, still]
    Health:
      type: object
      description: Status of the process and of its startup diagnostics.
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          description: |
            `ok` while every check passes. `degraded` when a check fails: the
            process keeps running and the UI explains the problem (RF-63).
          enum: [ok, degraded]
        checks:
          type: array
          description: Diagnostics in the order they run.
          items:
            $ref: '#/components/schemas/Check'
    Check:
      type: object
      description: |
        One named diagnostic. When it passes, only `name` and `ok` appear. When
        it fails, `ok` is false and `code` and `message` appear, plus the data
        that applies to that check (`path`, `uid`, `gid`).
      required: [name, ok]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Stable name of the check (`library`, `data`, `7zz`, `ffprobe`).
          example: library
        ok:
          type: boolean
        code:
          type: string
          description: |
            Stable reason of the failure, which the UI translates with i18n keys
            (RF-63). Omitted when the check passes.
          enum:
            - library_not_writable
            - data_not_writable
            - sevenzip_missing
            - ffprobe_missing
          example: library_not_writable
        message:
          type: string
          description: |
            Technical reason in English, for the log and for copying. Omitted when
            the check passes.
          example: 'cannot write to /library as uid=1000 gid=1000: permission denied. Give that user the Modify permission (ACL, inherited) on the dataset'
        path:
          type: string
          description: Folder that failed. Only in the library and data checks.
          example: /library
        uid:
          type: integer
          description: User of the process. Only in the library and data checks when they fail.
          example: 1000
        gid:
          type: integer
          description: Group of the process. Only in the library and data checks when they fail.
          example: 1000
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    BatchRelation:
      type: string
      description: |
        How the files of a batch relate (RF-03): `parts` for parts of one film or
        series, `episodes` for chapters of one series, `none` for no relation.
      enum: [parts, episodes, none]
    CreateBatchRequest:
      type: object
      required: [relation]
      additionalProperties: false
      properties:
        relation:
          $ref: '#/components/schemas/BatchRelation'
        name:
          type: string
          description: |
            Provisional name, such as the name of the folder dropped (RF-01a). It
            may be empty. Trimmed; no `/`, `\` or control characters; at most 255
            bytes. The final name is set when the files are processed (RF-08).
    Batch:
      type: object
      required: [id, name, relation, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Batch id made by the server; send it as `batchId` in the uploads.
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          example: 3kQ7Zr1xVb8mNcT2pL0aWq
        name:
          type: string
          description: Provisional name; empty when none was given.
        relation:
          $ref: '#/components/schemas/BatchRelation'
        createdAt:
          type: string
          format: date-time
    JobStatus:
      type: string
      description: |
        State of an upload job (RF-10a). `uploading` while the bytes arrive and
        `uploaded` once they all arrived. An archive then goes to `extracting`
        (or `needs_password`, which waits for `POST /jobs/{id}/password`) and,
        when it is extracted, to `filtering` (the filtering comes in a later
        phase). A volume of a multi-volume archive waits in `waiting_parts` until its set is
        complete, then the whole set is extracted together from its first volume;
        `done` is reached by a later phase. `failed`
        gives its reason in `error`; a failed job may move back to `extracting`
        with `POST /jobs/{id}/retry`. `cancelled` ends the job.
      enum:
        [
          uploading,
          uploaded,
          waiting_parts,
          extracting,
          needs_password,
          filtering,
          done,
          failed,
          cancelled,
        ]
    JobFailure:
      type: string
      description: |
        Stable reason of a job (RF-10b, RF-10c). The UI translates it with i18n
        keys. A `failed` job gives its reason here:
        `upload_abandoned`: the upload had no activity for 24 hours and its
        partial file was deleted, so the file must be uploaded again.
        `upload_missing`: the job was still uploading, but its file is no longer
        in staging.
        `no_space`: the library has no room to extract (1 GiB margin, RF-05).
        `archive_corrupt`: the archive is damaged or 7-Zip failed on it.
        `crc_mismatch`: an extracted file does not match the size or CRC32 of the
        archive index (RF-05).
        `archive_unsafe`: the archive has paths outside its folder or links.
        `parts_mismatch`: the volumes do not form one multi-volume archive.
        `parts_missing`: some volumes did not arrive within 24 hours.
        `legacy_volume`: an old-style RAR volume (`.r00`, `.r01`…), which is not supported.
        `no_video`: after filtering nothing is left to keep, neither a video nor a subtitle (RF-07).
        `no_space`, `archive_corrupt` and `crc_mismatch` can be retried; the
        others cannot (`legacy_volume` and `no_video` among them). A job in `needs_password` gives `wrong_password` here when
        the password it was sent did not open the archive.
      enum:
        [
          upload_abandoned,
          upload_missing,
          no_space,
          archive_corrupt,
          crc_mismatch,
          archive_unsafe,
          parts_mismatch,
          parts_missing,
          legacy_volume,
          no_video,
          wrong_password,
        ]
    PasswordRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: |
            Password of the archive. Sent once; never stored or logged. Without NUL
            characters (RF-04).
    UploadJob:
      type: object
      description: One uploaded file and its state (RF-10a, RF-10b).
      required:
        [id, batch, fileName, relativePath, size, received, progress, status, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Job id. It is also the id of the tus upload (the last segment of its `Location`).
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          example: 3kQ7Zr1xVb8mNcT2pL0aWq
        batch:
          $ref: '#/components/schemas/Batch'
        fileName:
          type: string
          description: File name, without folders.
        relativePath:
          type: string
          description: Path inside the folder dropped in the browser (RF-01a), ending with `fileName`. Empty for a file dropped on its own.
        size:
          type: integer
          format: int64
          description: Bytes the upload declared.
        received:
          type: integer
          format: int64
          description: Bytes that arrived so far. Equals `size` once the job is `uploaded`.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage extracted while the job is `extracting` (RF-10); 0 in other states, 100 once the archive is extracted.
        status:
          $ref: '#/components/schemas/JobStatus'
        error:
          $ref: '#/components/schemas/JobFailure'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          format: password
    Session:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
