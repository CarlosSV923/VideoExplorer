openapi: 3.0.3
info:
  title: VideoExplorer API
  version: 0.0.0
  description: |
    Single source of truth for the VideoExplorer HTTP contract.
    Go handlers (oapi-codegen strict server) and the TypeScript client
    (openapi-typescript) are generated from this file from phase 1 on; never
    edit generated code.

    This file describes only the endpoints that are implemented; the rest are
    added as they are built.

    Every operation requires the session cookie (`ve_session`) unless it
    declares `security: []`: only `/health` and `/auth/login` are public
    (RF-60, RNF-02). Errors use RFC 9457 problem details.
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: /api
tags:
  - name: system
    description: Process-level endpoints, such as the liveness probe.
  - name: auth
    description: Sign-in with the shared password and the session cookie.
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe and startup diagnostics
      description: |
        Always answers 200 while the process is up. The list of checks is empty
        until the startup diagnostics are implemented. When a check fails,
        `status` becomes `degraded` so the UI can explain the problem instead
        of the container crash-looping.
      security: []
      responses:
        '200':
          description: The process is up.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session with the shared password
      description: |
        Checks the shared password and sets the session cookie. Attempts are
        rate limited per client address: a burst of 5, then one more every 12 s.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Session started; the cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session on this device
      responses:
        '204':
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session
      responses:
        '200':
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ve_session

  responses:
    Unauthorized:
      description: Missing, invalid or expired session, or wrong password.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many login attempts from this client; retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      description: Status of the process and of its startup diagnostics.
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          description: |
            `ok` while every check passes. `degraded` when a check fails: the
            process keeps running and the UI explains the problem (RF-63).
          enum: [ok, degraded]
        checks:
          type: array
          description: Diagnostics in the order they run. Empty until the diagnostics are implemented.
          items:
            $ref: '#/components/schemas/Check'
    Check:
      type: object
      description: One named diagnostic.
      required: [name, ok]
      additionalProperties: false
      properties:
        name:
          type: string
          example: library
        ok:
          type: boolean
        message:
          type: string
          description: Why the check failed. Omitted when it passes.
          example: the library directory is not writable
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          format: password
    Session:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
