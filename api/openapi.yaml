openapi: 3.0.3
info:
  title: VideoExplorer API
  version: 0.0.0
  description: |
    Single source of truth for the VideoExplorer HTTP contract.
    Go handlers (oapi-codegen strict server) and the TypeScript client
    (openapi-typescript) are generated from this file from phase 1 on; never
    edit generated code.

    This file describes only the endpoints that are implemented; the rest are
    added as they are built.

    Every operation requires the session cookie (`ve_session`) unless it
    declares `security: []`: only `/health` and `/auth/login` are public
    (RF-60, RNF-02). Errors use RFC 9457 problem details.

    Uploads are NOT described here: they use the tus resumable upload protocol
    (https://tus.io/protocols/resumable-upload) mounted at /api/uploads/, behind
    the same session cookie (RF-02, RF-60). Upload-Length is required: the size
    is declared up front. Upload-Metadata keys: `filename` (required, the file
    name without folders), `relativePath` (optional, the file's path inside a
    folder dropped in the browser, ending with `filename`, RF-01a) and `batchId`
    (required, the id that `POST /batches` returned for the files dropped
    together, RF-03, RF-09a) and `partsTotal` (required for a volume of a multi-volume
    archive, `.partN.rar`, `.7z.001`, `.zip.001`…, and refused for any other file:
    how many volumes the browser counted for that set among the files dropped together,
    an integer from 2 to 999, RF-03). Names are trimmed; separators, `.`, `..` and
    control characters are refused. Refusals: 400 for bad metadata, a missing
    `batchId` or one that names no batch (`ERR_INVALID_METADATA`), 400 for a
    0-byte file
    (`ERR_EMPTY_FILE`, RF-09a), 507 when the library has no room for the file
    plus 1 GiB, counting the bytes still to arrive from uploads in progress
    (`ERR_INSUFFICIENT_STORAGE`, RF-05, RF-09a); 503 when the library is not
    writable (RFC 9457 problem). The upload id given in `Location` is the id of
    its job (`GET /jobs`, RF-10a). A DELETE of an upload whose archive is extracted
    and whose original waits for its move to the trash (its job is filtering, or
    failed with `trash_failed`) answers 409 (`ERR_ORIGINAL_PENDING`): nothing is
    deleted, and the job is retried first (RF-08a).
  license:
    name: MIT
    url: https://opensource.org/license/mit
servers:
  - url: /api
tags:
  - name: system
    description: Process-level endpoints, such as the liveness probe.
  - name: auth
    description: Sign-in with the shared password and the session cookie.
  - name: images
    description: Title images (posters, backdrops, logos, stills) from the local cache.
  - name: ingestion
    description: Upload batches, the files dropped together in the browser (RF-03), and the state of each upload (RF-10a, RF-10b).
  - name: section
    description: No asignados as the disk holds it now, and the changes of its entries (RF-27).
  - name: scans
    description: The two scans of the library, on a schedule and on demand, and when each last finished (RF-28).
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe and startup diagnostics
      description: |
        Always answers 200 while the process is up. It runs the diagnostics of
        RF-63 on every request: the library and data folders must accept a
        file written and removed by this process, and the external programs
        `7zz` and `ffprobe` must be in the PATH and start. When a check fails,
        `status` becomes `degraded` so the UI can explain the problem instead
        of the container crash-looping. TMDB is not checked.
      security: []
      responses:
        '200':
          description: The process is up.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Start a session with the shared password
      description: |
        Checks the shared password and sets the session cookie. Attempts are
        rate limited per client address: a burst of 5, then one more every 12 s.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Session started; the cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session on this device
      responses:
        '204':
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session
      responses:
        '200':
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /batches:
    post:
      tags: [ingestion]
      operationId: createBatch
      summary: Start a batch of files dropped together
      description: |
        Creates the batch that the files dropped together share and returns its
        id (RF-03). The browser calls it before the first upload of the batch and
        sends the id as `batchId` in the Upload-Metadata of each upload (see the
        description of the API for the uploads). A single file is sent with
        `relation: none` without asking the user (RF-03).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '201':
          description: The batch was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs:
    get:
      tags: [ingestion]
      operationId: listJobs
      summary: Most recent upload jobs
      description: |
        The 100 most recent upload jobs, newest first, each with its batch
        (RF-10b). A job is one file the browser uploaded (RF-10a). These are the
        same objects the event stream sends (`/jobs/events`).
      responses:
        '200':
          description: The jobs, newest first; at most 100.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/events:
    get:
      tags: [ingestion]
      operationId: streamJobEvents
      summary: Live upload job changes (server-sent events, RF-10b)
      description: |
        `text/event-stream`, one event for each change of a job's state or
        progress. Every event is named `job` and its `data` line holds one
        UploadJob JSON object with the whole state of the job:

        ```
        event: job
        data: {"id":"3kQ7Zr1xVb8mNcT2pL0aWq","status":"uploading","received":1048576,...}

        ```

        On connect the server sends one `job` event for each job that `GET /jobs`
        would return, then streams the changes. Progress-only events of one job
        are limited to about two per second; a change of status or failure reason
        is never dropped. A client that falls too far behind is disconnected, and
        its `EventSource` reconnects and receives the snapshot again. A comment
        line (`: ping`) is sent every 25 seconds to keep proxies from closing the
        connection. The stream ends when the server shuts down.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/{id}/password:
    post:
      tags: [ingestion]
      operationId: submitJobPassword
      summary: Send the password of an encrypted archive
      description: |
        Sends the password of an archive whose job waits in `needs_password`
        (RF-04). The password is used to open the archive and is never stored
        or logged. The job goes back to `extracting`; when the password does not
        open the archive, the job stays in `needs_password` with
        `error: wrong_password` (RF-10c). Answers 409 when the job is not waiting
        for a password.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '202':
          description: The password was queued; the job is extracted or asks again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /jobs/{id}/retry:
    post:
      tags: [ingestion]
      operationId: retryJob
      summary: Retry a job that failed for a retryable reason
      description: |
        Retries a job that failed with `no_space`, `archive_corrupt` or
        `crc_mismatch` (RF-10c): the archive is still in staging and the extracted
        files of the failed attempt are deleted first, and the job goes back to
        `extracting`. A job that failed with `filter_failed` goes back to
        `filtering` and is filtered again from what was recorded (RF-07). A job
        that failed with `move_failed` goes back to `filtering` and its batch
        moves to No asignados again from where it stopped; the jobs of the same
        batch that failed the same way retry with it (RF-08a). A job that failed
        with `trash_failed` goes back to `filtering`: only the original that did
        not reach the trash is moved again, and then the job goes on (RF-08a).
        Answers 409 for any other job, or when the archive or the files it needs
        are no longer there.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: The retry was queued; the job is `extracting` again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /jobs/{id}/dismiss:
    post:
      tags: [ingestion]
      operationId: dismissJob
      summary: Take a failed Samba copy off No asignados ("Quitar")
      description: |
        Takes a copy of Samba that failed without Reintentar off the section (RF-27a). Its job, and the
        jobs of its volumes, stop being listed in `GET /unassigned`, and stay in `GET /jobs` with the same
        `id`. Nothing is deleted: the copy went to the trash when it failed (RF-30). Answers 409 for any
        other job: an upload, a job that is not failed, or one that failed with a reason Reintentar can
        fix.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job, which the section no longer lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /images/{kind}/{file}:
    get:
      tags: [images]
      operationId: getImage
      summary: Title image served from the local cache
      description: |
        A poster, backdrop, logo or episode still of TMDB. The file is downloaded
        from TMDB's image CDN on first use, at the size that spec §6 sets for its
        kind, and kept under DATA_PATH/cache/images. The browser never contacts
        TMDB (RNF-10). Images do not expire. Without TMDB configured, only the
        images already cached are served; the others answer 404.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImageKind'
        - name: file
          in: path
          required: true
          description: File name of the TMDB image path, without its leading slash.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,128}\.(jpe?g|png)$'
            example: 9ZmWNo1wq1y9vSIt7iGlVAtsgXB.jpg
      responses:
        '200':
          description: The image. Range and conditional requests are honoured.
          headers:
            Cache-Control:
              description: Exception to RNF-02 for images (RNF-02, §6).
              schema:
                type: string
                enum: ['private, max-age=2592000, immutable']
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /unassigned/{id}/lock:
    post:
      tags: [assign]
      operationId: takeAssignLock
      summary: Open the assignment of an entry of No asignados (RF-26)
      description: |
        Takes the assignment lock of the entry for this tab and answers its token. The tab
        sends the token back in `X-Assign-Lock` on the other operations of the assignment. A tab
        that already holds the lock renews it by sending its token. While another tab holds
        the lock the answer is 409 with `code: assigning`. A lock with no activity for 15 minutes
        expires by itself (RF-26); every plan renews it.
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/AssignLockToken'
      responses:
        '200':
          description: The lock is held by this tab until `expiresAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignLock'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssignConflict'
    delete:
      tags: [assign]
      operationId: releaseAssignLock
      summary: Cancel the assignment of an entry (RF-26)
      description: |
        Frees the lock when the token in `X-Assign-Lock` holds it. With any other token nothing
        changes. The entry stays in No asignados as it was.
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/AssignLockToken'
      responses:
        '204':
          description: The lock is free, or it was not held by this tab.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /unassigned/{id}/suggestions:
    get:
      tags: [assign]
      operationId: getAssignSuggestions
      summary: What each file of the entry is, and its best TMDB match (RF-20, RF-23)
      description: |
        Reads the name of each video and subtitle of the entry and of its folders (RF-20), with the
        title that TMDB finds first for each video when TMDB is configured (spec §6). A relation of
        chapters (RF-03) gives the entry a title: the series of its chapters. Subtitles whose name
        gives no language are preselected as Latin American Spanish (RF-23). Needs the lock.
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/AssignLockToken'
      responses:
        '200':
          description: The suggestions of the entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignSuggestions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssignConflict'

  /unassigned/{id}/plan:
    post:
      tags: [assign]
      operationId: planAssign
      summary: Preview the assignment of an entry (RF-24, RF-25)
      description: |
        Checks the choices of the form and answers the preview: the final paths (spec §5), the
        duplicates of each place and what can be answered to them, and the errors and warnings,
        each with the file and the field it is about. Changes nothing in the library. Renews the
        lock (RF-26). `valid` is true when the same choices can be committed.
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/AssignLockToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '200':
          description: The preview. It may hold errors, which `valid` reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssignConflict'

  /unassigned/{id}/commit:
    post:
      tags: [assign]
      operationId: commitAssign
      summary: Store the assignment of an entry in the library (RF-25, RF-26)
      description: |
        Checks the choices again and performs them as one change of the library (RF-25): the
        titles that are new are added to the registry, the videos and their subtitles move to their
        final paths, the duplicates that are replaced go to the trash, and the versions take their
        labels. Nothing is overwritten. If anything fails, everything is undone and the entry stays
        as it was. What is not placed stays in No asignados, and the entry disappears when nothing is
        left in it. A commit that succeeds releases the lock.
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/AssignLockToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssignConflict'
        '422':
          $ref: '#/components/responses/AssignInvalid'

  /unassigned:
    get:
      tags: [section]
      operationId: getUnassigned
      summary: The entries of No asignados, read now from _unassigned/ (RF-27)
      description: |
        Reads `_unassigned/` at this moment, without waiting for the scan, so that what Samba copied
        shows up here. Each entry is a first-level folder, or a loose file, that is not junk: names that
        start with `.`, `@`, `#` or `$` and `Thumbs.db` or `desktop.ini` are neither listed nor counted
        (RF-28). Its files are those inside it, in any subfolder, with their sizes.

        A file is `copying` when its size or modification time changed since the previous reading, or when
        it was modified less than a minute ago (RF-27); its entry is `copying` too, and admits no action
        until it settles. An entry that an assignment holds is `assigning` (RF-26). A file or folder that
        Samba copied is an entry of origin `samba` with no relation. An entry that is gone from the disk
        leaves the section. Entries are sorted by name.

        A compressed file that Samba copied (recognized by its bytes, RF-27a) is taken as an upload once it
        settles: it leaves `_unassigned/` for staging, its job is listed in `jobs`, and when the job is done
        its content is an entry of origin `upload` named after the archive. A folder left empty by that
        leaves the section.
      responses:
        '200':
          description: The entries of the section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnassignedSection'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /unassigned/{id}/trash:
    post:
      tags: [section]
      operationId: trashUnassignedEntry
      summary: Send an entry of No asignados to the trash (RF-27, RF-30)
      description: |
        Sends every file of the entry to the trash, each with its own trash record: its origin (`upload`
        or `samba`), the reason `removed`, its batch and its place in the drop. Its junk goes without the
        trash, and so do its folders. A video or subtitle inside a junk folder is held (RF-27): that folder
        and the entry stay. An entry that an assignment holds is refused (`assigning`), and one
        with a file still being copied is refused (`copying`).
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '204':
          description: The entry is in the trash.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'

  /unassigned/{id}/delete:
    post:
      tags: [section]
      operationId: deleteUnassignedEntry
      summary: Delete an entry of No asignados for good (RF-27, RF-30)
      description: |
        Deletes every file of the entry and its junk, without the trash. The interface asks for
        confirmation before it calls this operation. The same refusals as the trash apply (RF-26, RF-27).
        A video or subtitle inside a junk folder (such as `@eaDir/`) is held (RF-27): that folder stays with
        its content, and so does the entry, which is listed with the files that remain visible.
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '204':
          description: The entry is deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'

  /unassigned/{id}/files/trash:
    post:
      tags: [section]
      operationId: trashUnassignedFile
      summary: Send one file of an entry of No asignados to the trash (RF-27, RF-30)
      description: |
        Sends the file to the trash, with its record, as the trash of the entry does. A video goes with the
        subtitles of its name. The file of a loose entry is the entry itself: use the entry operations.
      parameters:
        - $ref: '#/components/parameters/EntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnassignedFileRequest'
      responses:
        '204':
          description: The file is in the trash.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'

  /unassigned/{id}/files/delete:
    post:
      tags: [section]
      operationId: deleteUnassignedFile
      summary: Delete one file of an entry of No asignados for good (RF-27, RF-30)
      description: |
        Deletes the file without the trash. A video goes with the subtitles of its name. The file of a loose
        entry is the entry itself: use the entry operations. The interface asks for confirmation first.
      parameters:
        - $ref: '#/components/parameters/EntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnassignedFileRequest'
      responses:
        '204':
          description: The file is deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'

  /unassigned/{id}/download:
    get:
      tags: [section]
      operationId: downloadUnassignedEntry
      summary: Download an entry of No asignados (RF-27)
      description: |
        Downloads a loose file directly, or a folder as a store-only zip preserving the entry's structure.
        The exact zip size is announced. An entry that is copying or being assigned answers 409.
      parameters:
        - $ref: '#/components/parameters/EntryId'
      responses:
        '200':
          description: The entry file or zip.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'
        '416':
          description: The requested range cannot be satisfied.

  /unassigned/{id}/files/download:
    get:
      tags: [section]
      operationId: downloadUnassignedFile
      summary: Download one file of No asignados with HTTP Range support (RF-27)
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - name: path
          in: query
          required: true
          description: The file path as listed inside the entry; it is checked against the entry and never used as a filesystem path.
          schema:
            type: string
            minLength: 0
            maxLength: 1024
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'
        '416':
          description: The requested range cannot be satisfied.

  /scans:
    get:
      tags: [scans]
      operationId: getScans
      summary: The two scans of the library and when each last finished (RF-28)
      description: |
        `unassigned` reads `_unassigned/` and takes its settled copies of Samba (RF-27, RF-27a); `library`
        scans `Movies/` and `TV Shows/`. Each runs when the server starts, without delaying it, and then at
        its interval (`UNASSIGNED_SCAN_INTERVAL`, `LIBRARY_SCAN_INTERVAL`). A scan never overlaps itself.
        `lastFinishedAt` is when the scan last finished; it is absent until it does, and it survives a restart.
      responses:
        '200':
          description: The state of both scans, `unassigned` first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatuses'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [scans]
      operationId: runScans
      summary: Scan now, both scans («Escanear ahora», RF-28)
      description: |
        Starts both scans in the background. A scan that is running is not started again, so asking while
        one runs only starts the other. The answer is the state of both scans right after the call.
      responses:
        '202':
          description: The scans were started, or were already running; the state of both, `unassigned` first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatuses'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /titles/search:
    get:
      tags: [assign]
      operationId: searchTitles
      summary: Titles to assign to, the library's first (RF-21)
      description: |
        The titles of the library whose words all appear in their title, without regard to case or
        accents, and then the TMDB movies and series that match (RF-21). A TMDB title already in the
        library carries its `libraryTitleId`, so that it is assigned there. Only the library answers
        when TMDB is not configured or does not answer (`tmdbAvailable` false).
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: year
          in: query
          required: false
          description: Only TMDB results from this year (the first release or air year).
          schema:
            type: integer
            minimum: 1
            maximum: 9999
      responses:
        '200':
          description: The titles found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleSearch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /library/titles:
    get:
      tags: [library]
      operationId: listLibraryTitles
      summary: The titles of the library (RF-40, RF-43)
      description: |
        The titles that have at least one file out of the trash, by id. A title whose files are all in
        the trash is not in the library (RF-30): it is not listed, and it keeps its registry for RF-31.
      responses:
        '200':
          description: The titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryTitles'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /library/titles/{id}:
    get:
      tags: [library]
      operationId: getLibraryTitle
      summary: A title of the library with its files (RF-43)
      description: |
        The title with its videos and their subtitles, the files that are out of the trash. The poster is
        the file name that `/api/images/poster/{file}` serves, when TMDB is configured and knows the title
        (spec §6); it is omitted otherwise. A chapter of a free series carries the title read from its name.
      parameters:
        - $ref: '#/components/parameters/TitleId'
      responses:
        '200':
          description: The title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryTitle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /library/titles/{id}/files/{fileId}/technical:
    get:
      tags: [library]
      operationId: getLibraryFileTechnical
      summary: Technical information of a library video (RF-44)
      description: |
        The technical information of one live video of the title. Both ids are checked against the
        library registry; a video in the trash, a video of another title, or an unknown title or video
        answers 404. `path` is relative to the library dataset; the server never accepts a client path.
        When ffprobe cannot read the file, the response remains 200 with `readable` false and the known
        path and size; the technical fields are empty or zero.
      parameters:
        - $ref: '#/components/parameters/TitleId'
        - $ref: '#/components/parameters/LibraryFileId'
      responses:
        '200':
          description: The technical information. It may be incomplete when ffprobe cannot read the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryFileTechnical'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /library/titles/{id}/download:
    get:
      tags: [library]
      operationId: downloadLibraryTitle
      summary: Download a whole library title as a streamed store zip (RF-44)
      description: |
        Streams the live videos and their external subtitles of the title, keeping the title folder and
        its subfolders as they are on disk. The zip is store-only, announces its exact Content-Length, and
        uses Zip64 when needed. Files in the trash are not included; the server builds every path from the
        title id and its registry.
      parameters:
        - $ref: '#/components/parameters/TitleId'
      responses:
        '200':
          description: The title as a streamed zip.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /library/titles/{id}/seasons/{season}/download:
    get:
      tags: [library]
      operationId: downloadLibrarySeason
      summary: Download one season of a library series as a streamed store zip (RF-44)
      parameters:
        - $ref: '#/components/parameters/TitleId'
        - name: season
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 999
      responses:
        '200':
          description: The season as a streamed zip.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /library/titles/{id}/files/{fileId}/download:
    get:
      tags: [library]
      operationId: downloadLibraryFile
      summary: Download one library file with HTTP Range support (RF-44)
      description: |
        Streams one live video or external subtitle selected by its registry id. Range and conditional
        requests are handled by http.ServeContent. The server builds the filesystem path from both ids and
        refuses missing, trashed or symbolic-link files.
      parameters:
        - $ref: '#/components/parameters/TitleId'
        - $ref: '#/components/parameters/LibraryFileId'
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: The requested range cannot be satisfied.

  /library/titles/{id}/edit/plan:
    post:
      tags: [library]
      operationId: planTitleEdit
      summary: Preview the edit of a title, with its new name, its folder and where each file goes (RF-44)
      description: |
        Checks the choices of the edit form for a title of the library and answers its preview: the title's
        identity after the edit, the final path of each video and subtitle (spec §5), the duplicates of each
        place and the answers they accept (RF-24), and the errors and warnings. Changes nothing. `valid` is
        true when the same request can be committed. Every video and subtitle of the title needs a choice.
      parameters:
        - $ref: '#/components/parameters/TitleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRequest'
      responses:
        '200':
          description: The preview. It may hold errors, which `valid` reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /library/titles/{id}/edit/commit:
    post:
      tags: [library]
      operationId: commitTitleEdit
      summary: Store the edit of a title as one change of the library (RF-44)
      description: |
        Checks the choices again under the library's lock and performs them as one change: the files move
        and are renamed to their final paths, the replaced files go to the trash with their subtitles, the
        old versions take their labels, and the registry takes the new values. Nothing is overwritten. If
        anything fails, everything is undone. The request's `revision` must be the one of the plan: when the
        title changed since, the answer is 409 `plan_changed` and the plan is checked again (RF-25).
      parameters:
        - $ref: '#/components/parameters/TitleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRequest'
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EditConflict'
        '422':
          $ref: '#/components/responses/EditInvalid'

  /library/titles/{id}/id-tag/plan:
    post:
      tags: [library]
      operationId: planTitleIDTag
      summary: Preview putting the ID tag on a title or taking it off (RF-45)
      description: |
        Checks the ID tag action of a linked title and answers its preview, as an edit does (RF-44): the folder the
        title has after the action, the final path of each video and subtitle (spec §5), the duplicates, and the
        errors and warnings. The choices of the files stay as they are. A movie and its files take the names of spec
        §5 with or without the tag; a series moves only its folder, so its chapters and subtitles keep their names. The
        answers to the duplicates of the places (RF-24) go in `videos`, as in an edit. A free title has no tag: its plan
        is not valid (`free_title`). Changes nothing.
      parameters:
        - $ref: '#/components/parameters/TitleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IDTagRequest'
      responses:
        '200':
          description: The preview. It may hold errors, which `valid` reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /library/titles/{id}/id-tag/commit:
    post:
      tags: [library]
      operationId: commitTitleIDTag
      summary: Store the ID tag action of a title as one change of the library (RF-45)
      description: |
        Checks the action again under the library's lock and performs it as one change, the same way as an edit
        (RF-44): the folder and the files take their new names, the registry takes the tag, and nothing is
        overwritten. If anything fails, everything is undone. The request's `revision` must be the one of the plan:
        when the title changed since, the answer is 409 `plan_changed` (RF-25).
      parameters:
        - $ref: '#/components/parameters/TitleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IDTagRequest'
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EditConflict'
        '422':
          $ref: '#/components/responses/EditInvalid'

  /library/titles/{id}/unassigned:
    post:
      tags: [library]
      operationId: moveTitleToUnassigned
      summary: Move a title, a season or a file to No asignados, with its subtitles (RF-44)
      description: |
        Moves what the scope names to No asignados as a new entry, with origin `samba` and relation `none`
        (RF-44): a title keeps its folder's name, a season is named "<Título> (<Año>) Season NN", a video
        with subtitles keeps its name without the extension as its folder, and a video without subtitles
        is a loose file. The registry forgets what moved; a title with nothing left is removed. One change
        of the library, undone as a whole on failure.
      parameters:
        - $ref: '#/components/parameters/TitleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryScope'
      responses:
        '204':
          description: The entry is in No asignados.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /library/titles/{id}/trash:
    post:
      tags: [library]
      operationId: trashTitleScope
      summary: Send a title, a season or a file to the trash, with its subtitles (RF-44, RF-30)
      description: |
        Sends what the scope names to the trash, one trash entry per video with its subtitles, with origin
        `library` and reason `removed`, so that restoring it puts it back in its place (RF-31). The rows stay
        in the registry, marked as trashed; a title whose files are all in the trash leaves the library and
        keeps its registry for restoring (RF-30).
      parameters:
        - $ref: '#/components/parameters/TitleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryScope'
      responses:
        '204':
          description: The files are in the trash.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trash:
    get:
      tags: [library]
      operationId: listTrash
      summary: List trash entries, newest first (RF-31a)
      responses:
        '200':
          description: Trash entries with files and purge dates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [library]
      operationId: emptyTrash
      summary: Permanently empty the trash (RF-30, RF-31a)
      description: The caller presents confirmation in the UI; this operation does not ask for it.
      responses:
        '204':
          description: The trash is empty.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trash/{id}:
    delete:
      tags: [library]
      operationId: deleteTrashEntry
      summary: Permanently delete a trash entry (RF-30, RF-31a)
      description: The caller presents confirmation in the UI; this operation does not ask for it.
      parameters:
        - $ref: '#/components/parameters/TrashId'
      responses:
        '204':
          description: The entry and its files are permanently deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trash/{id}/restore/plan:
    post:
      tags: [library]
      operationId: planTrashRestore
      summary: Preview restoring an entry (RF-31, RF-31a)
      parameters:
        - $ref: '#/components/parameters/TrashId'
      responses:
        '200':
          description: Restore destinations and conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashRestorePlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /trash/{id}/restore:
    post:
      tags: [library]
      operationId: restoreTrashEntry
      summary: Restore an entry to its source (RF-31, RF-31a)
      parameters:
        - $ref: '#/components/parameters/TrashId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashRestoreRequest'
      responses:
        '200':
          description: The entry was restored, or restored is empty when the user cancels (RF-24).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashRestoreResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EditConflict'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ve_session

  parameters:
    TrashId:
      name: id
      in: path
      required: true
      description: Trash entry id (RF-31a).
      schema:
        type: integer
        format: int64
        minimum: 1
    TitleId:
      name: id
      in: path
      required: true
      description: A title of the library, its id in the registry (RF-21, RF-43).
      schema:
        type: integer
        format: int64
        minimum: 1
    LibraryFileId:
      name: fileId
      in: path
      required: true
      description: A video file id in the title's library registry (RF-44).
      schema:
        type: integer
        format: int64
        minimum: 1
    EntryId:
      name: id
      in: path
      required: true
      description: Entry of No asignados, its id in the registry of the unassigned section (`GET` of the section, RF-27).
      schema:
        type: integer
        format: int64
        minimum: 1
    AssignLockToken:
      name: X-Assign-Lock
      in: header
      required: false
      description: |
        The token of the assignment lock that `POST /unassigned/{id}/lock` answered. A call without
        it, or with a token that does not hold the lock, is answered with `lock_lost` or `assigning`
        (RF-26).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
    JobId:
      name: id
      in: path
      required: true
      description: Job id, the id of its tus upload (`GET /jobs`).
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
  responses:
    Unauthorized:
      description: Missing, invalid or expired session, or wrong password.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many login attempts from this client; retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request does not name a valid resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource is not available, and TMDB cannot provide it either.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource is in a state that does not allow the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AssignConflict:
      description: |
        The assignment cannot go on: another tab is assigning the entry (`assigning`), this tab
        does not hold its lock (`lock_lost`), or a file of the entry is still being copied (`copying`)
        (RF-26, RF-27).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssignProblem'
    EntryConflict:
      description: |
        The entry cannot change now: another tab is assigning it (`assigning`, RF-26), or a file of it
        is still being copied (`copying`, RF-27). Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/EntryProblem'
    AssignInvalid:
      description: |
        The choices do not form an assignment that can be stored. The body is the plan of the same
        choices, with the errors that stop it (RF-25).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssignPlan'
    EditConflict:
      description: |
        The edit cannot be stored on the title as the plan saw it: the title changed since (`plan_changed`).
        Nothing was changed; the plan is checked again (RF-25, RF-44).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/EditProblem'
    EditInvalid:
      description: |
        The choices do not form an edit that can be stored. The body is the plan of the same choices, with the
        errors that stop it (RF-25, RF-44).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EditPlan'
    BadGateway:
      description: The image is not cached and TMDB could not provide it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    TrashList:
      type: object
      required: [entries]
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TrashEntry'
    TrashEntry:
      type: object
      description: An entry in the trash, with its files and expiry (RF-31a).
      required: [id, origin, reason, trashedAt, purgeAt, files]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        origin:
          type: string
          enum: [upload, samba, library]
        reason:
          type: string
          enum: [extracted, filtered, replaced, removed]
        trashedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
        relativePath:
          type: string
          description: Original path inside the drop or library when known.
        batchId:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/TrashFile'
    TrashFile:
      type: object
      required: [name, size]
      additionalProperties: false
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
    TrashRestorePlan:
      type: object
      required: [entryId, files]
      additionalProperties: false
      properties:
        entryId:
          type: integer
          format: int64
        files:
          type: array
          items:
            $ref: '#/components/schemas/TrashRestoreFilePlan'
    TrashRestoreFilePlan:
      type: object
      required: [file, destinations, duplicates, allowed, versionIncomplete]
      additionalProperties: false
      properties:
        file:
          type: string
        destinations:
          type: array
          items:
            type: string
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/PlanDuplicate'
        allowed:
          type: array
          items:
            $ref: '#/components/schemas/TrashRestoreDecision'
        proposal:
          $ref: '#/components/schemas/TrashRestoreDecision'
        versionProposal:
          type: string
          description: Proposed version label for the restored video (RF-24).
        versionIncomplete:
          type: boolean
          description: The proposed label needs an editable value before keep_both can be committed.
    TrashRestoreDecision:
      type: string
      enum: [replace, keep_both, cancel]
      description: RF-24 decision for a restored video.
    TrashRestoreRequest:
      type: object
      required: [decisions]
      additionalProperties: false
      properties:
        decisions:
          type: array
          items:
            type: object
            required: [file, decision]
            additionalProperties: false
            properties:
              file:
                type: string
              decision:
                $ref: '#/components/schemas/TrashRestoreDecision'
              version:
                type: string
                description: Version label written when choosing keep_both (RF-24).
    TrashRestoreResult:
      type: object
      required: [restored]
      additionalProperties: false
      properties:
        restored:
          type: array
          items:
            type: string
          description: Destination paths restored by the engine.
    ImageKind:
      type: string
      description: |
        Kind of title image. Each kind has the TMDB size of spec §6: poster w500,
        backdrop w1280, logo w500, still w300.
      enum: [poster, backdrop, logo, still]
    Health:
      type: object
      description: Status of the process and of its startup diagnostics.
      required: [status, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          description: |
            `ok` while every check passes. `degraded` when a check fails: the
            process keeps running and the UI explains the problem (RF-63).
          enum: [ok, degraded]
        checks:
          type: array
          description: Diagnostics in the order they run.
          items:
            $ref: '#/components/schemas/Check'
    Check:
      type: object
      description: |
        One named diagnostic. When it passes, only `name` and `ok` appear. When
        it fails, `ok` is false and `code` and `message` appear, plus the data
        that applies to that check (`path`, `uid`, `gid`).
      required: [name, ok]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Stable name of the check (`library`, `data`, `7zz`, `ffprobe`).
          example: library
        ok:
          type: boolean
        code:
          type: string
          description: |
            Stable reason of the failure, which the UI translates with i18n keys
            (RF-63). Omitted when the check passes.
          enum:
            - library_not_writable
            - data_not_writable
            - sevenzip_missing
            - ffprobe_missing
          example: library_not_writable
        message:
          type: string
          description: |
            Technical reason in English, for the log and for copying. Omitted when
            the check passes.
          example: 'cannot write to /library as uid=1000 gid=1000: permission denied. Give that user the Modify permission (ACL, inherited) on the dataset'
        path:
          type: string
          description: Folder that failed. Only in the library and data checks.
          example: /library
        uid:
          type: integer
          description: User of the process. Only in the library and data checks when they fail.
          example: 1000
        gid:
          type: integer
          description: Group of the process. Only in the library and data checks when they fail.
          example: 1000
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    BatchRelation:
      type: string
      description: |
        How the files of a batch relate (RF-03): `parts` for parts of one film or
        series, `episodes` for chapters of one series, `none` for no relation.
      enum: [parts, episodes, none]
    CreateBatchRequest:
      type: object
      required: [relation]
      additionalProperties: false
      properties:
        relation:
          $ref: '#/components/schemas/BatchRelation'
        name:
          type: string
          description: |
            Provisional name, such as the name of the folder dropped (RF-01a). It
            may be empty. Trimmed; no `/`, `\` or control characters; at most 255
            bytes. The final name is set when the files are processed (RF-08).
    Batch:
      type: object
      required: [id, name, relation, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Batch id made by the server; send it as `batchId` in the uploads.
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          example: 3kQ7Zr1xVb8mNcT2pL0aWq
        name:
          type: string
          description: Provisional name; empty when none was given.
        relation:
          $ref: '#/components/schemas/BatchRelation'
        createdAt:
          type: string
          format: date-time
    JobStatus:
      type: string
      description: |
        State of an upload job (RF-10a). `uploading` while the bytes arrive and
        `uploaded` once they all arrived. An archive then goes to `extracting`
        (or `needs_password`, which waits for `POST /jobs/{id}/password`) and,
        when it is extracted, to `filtering` (the filtering comes in a later
        phase). A volume of a multi-volume archive waits in `waiting_parts` until its set is
        complete, then the whole set is extracted together from its first volume;
        `done` is reached by a later phase. `discarded` (RF-07) ends a job whose
        content the filter discarded entirely while its batch keeps something; its
        files are in the trash. `failed`
        gives its reason in `error`; a failed job may move back to `extracting`
        with `POST /jobs/{id}/retry`. `cancelled` ends the job.
      enum:
        [
          uploading,
          uploaded,
          waiting_parts,
          extracting,
          needs_password,
          filtering,
          done,
          discarded,
          failed,
          cancelled,
        ]
    JobFailure:
      type: string
      description: |
        Stable reason of a job (RF-10b, RF-10c). The UI translates it with i18n
        keys. A `failed` job gives its reason here:
        `upload_abandoned`: the upload had no activity for 24 hours and its
        partial file was deleted, so the file must be uploaded again.
        `upload_missing`: the job was still uploading, but its file is no longer
        in staging.
        `no_space`: the library has no room to extract (1 GiB margin, RF-05).
        `archive_corrupt`: the archive is damaged or 7-Zip failed on it.
        `crc_mismatch`: an extracted file does not match the size or CRC32 of the
        archive index (RF-05).
        `archive_unsafe`: the archive has paths outside its folder or links.
        `parts_mismatch`: the volumes do not form one multi-volume archive.
        `parts_missing`: some volumes did not arrive within 24 hours.
        `legacy_volume`: an old-style RAR volume (`.r00`, `.r01`…), which is not supported.
        `no_video`: after filtering nothing is left to keep, neither a video nor a subtitle (RF-07).
        `filter_failed`: reading or writing the staging area failed while filtering (RF-07, RF-08a).
        `move_failed`: reading or writing the library failed while moving the content to No asignados (RF-08a).
        `trash_failed`: the original of the archive did not reach the trash after its extraction; it stays in staging
        and nothing is deleted (RF-08a).
        `no_space`, `archive_corrupt` and `crc_mismatch` can be retried, and so can `filter_failed`, `move_failed` and
        `trash_failed`; the others cannot (`legacy_volume` and `no_video` among them). A job in `needs_password` gives `wrong_password` here when
        the password it was sent did not open the archive.
      enum:
        [
          upload_abandoned,
          upload_missing,
          no_space,
          archive_corrupt,
          crc_mismatch,
          archive_unsafe,
          parts_mismatch,
          parts_missing,
          legacy_volume,
          no_video,
          filter_failed,
          move_failed,
          trash_failed,
          wrong_password,
        ]
    PasswordRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: |
            Password of the archive. Sent once; never stored or logged. Without NUL
            characters (RF-04).
    UploadJob:
      type: object
      description: One uploaded file and its state (RF-10a, RF-10b).
      required:
        [id, batch, fileName, relativePath, size, received, progress, status, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Job id. It is also the id of the tus upload (the last segment of its `Location`).
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          example: 3kQ7Zr1xVb8mNcT2pL0aWq
        batch:
          $ref: '#/components/schemas/Batch'
        fileName:
          type: string
          description: File name, without folders.
        relativePath:
          type: string
          description: Path inside the folder dropped in the browser (RF-01a), ending with `fileName`. Empty for a file dropped on its own.
        size:
          type: integer
          format: int64
          description: Bytes the upload declared.
        received:
          type: integer
          format: int64
          description: Bytes that arrived so far. Equals `size` once the job is `uploaded`.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage extracted while the job is `extracting` (RF-10); 0 in other states, 100 once the archive is extracted.
        status:
          $ref: '#/components/schemas/JobStatus'
        error:
          $ref: '#/components/schemas/JobFailure'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          format: password
    Session:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
    AssignLock:
      type: object
      description: |
        The assignment lock of an entry (RF-26). The tab keeps `token` and sends it back in
        `X-Assign-Lock`; the lock ends at `expiresAt` unless a plan renews it.
      required: [token, expiresAt]
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        expiresAt:
          type: string
          format: date-time
    AssignProblem:
      description: RFC 9457 problem details of an assignment, with the stable reason in `code`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: |
                `assigning`: another tab holds the entry, which is being assigned (RF-26). `lock_lost`:
                this tab does not hold the lock any more (it expired, or it was never taken); open the
                assignment again. `plan_changed`: a file of the library took a place that the plan needed, so nothing was changed; the plan is checked again (RF-25).
                `copying`: a file of the entry is still being copied, so it cannot be assigned yet (RF-27).
              enum: [assigning, lock_lost, plan_changed, copying]
    ScanKind:
      type: string
      description: |
        `unassigned` is the scan of `_unassigned/` (RF-27a, RF-28); `library` is the scan of `Movies/` and
        `TV Shows/` (RF-29).
      enum: [unassigned, library]
    ScanStatus:
      type: object
      description: One scan of the library (RF-28).
      required: [kind, running]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/ScanKind'
        lastFinishedAt:
          type: string
          format: date-time
          description: When the scan last finished. Absent until it does; it survives a restart.
        running:
          type: boolean
          description: Whether the scan is running now.
    ScanStatuses:
      type: object
      description: The state of the two scans of the library, `unassigned` first (RF-28).
      required: [scans]
      additionalProperties: false
      properties:
        scans:
          type: array
          items:
            $ref: '#/components/schemas/ScanStatus'
    UnassignedSection:
      type: object
      description: The entries of No asignados, as the disk holds them now (RF-27), and the jobs of the compressed files Samba copied (RF-27a).
      required: [entries, jobs]
      additionalProperties: false
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/UnassignedEntry'
        jobs:
          type: array
          description: |
            The jobs of the compressed files that Samba copied into `_unassigned/` (RF-27a), one per unit: the
            job of the first volume of a set. A job is listed while its content has not reached No asignados,
            the trash or a cancellation; a failed one stays listed, with its reason, so that its password or
            its retry can be sent, until it is taken off with `POST /jobs/{id}/dismiss`. Each item is the object
            `GET /jobs` lists, with the same `id`.
          items:
            $ref: '#/components/schemas/UploadJob'
    UnassignedEntry:
      type: object
      description: |
        An entry of No asignados: a first-level folder of `_unassigned/`, or a loose file (RF-08, RF-27).
        Its `id` is its id in the registry and stays while the entry is in No asignados.
      required: [id, name, origin, relation, loose, status, size, files]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          description: The name of the folder or of the loose file, with its extension.
        origin:
          type: string
          description: '`upload` when the ingestion moved it in (RF-08), `samba` when Samba copied it (RF-27).'
          enum: [upload, samba]
        relation:
          $ref: '#/components/schemas/BatchRelation'
        loose:
          type: boolean
          description: A single file kept as it is. Its only file is the entry itself.
        status:
          type: string
          description: |
            `copying` while a file is still being copied, which takes precedence; `assigning` while an
            assignment holds the entry (RF-26); `ready` otherwise.
          enum: [ready, copying, assigning]
        size:
          type: integer
          format: int64
          minimum: 0
          description: The total size of its files, junk not counted.
        files:
          type: array
          items:
            $ref: '#/components/schemas/UnassignedFile'
    UnassignedFile:
      type: object
      description: A file of an entry, with its size and whether it is still being copied (RF-27).
      required: [path, size, copying]
      additionalProperties: false
      properties:
        path:
          type: string
          description: |
            Its place inside the entry, with "/" separators (a subfolder's files have one). Empty for a loose
            entry, whose file is the entry itself.
        size:
          type: integer
          format: int64
          minimum: 0
        copying:
          type: boolean
    UnassignedFileRequest:
      type: object
      description: The file of an entry that a change applies to, by its place inside the entry.
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          description: |
            The place of the file inside the entry, as the section listed it. Names are checked on the
            server: no empty name, no `.` or `..`, no separator in a name, no control character.
          minLength: 1
          maxLength: 1024
    EntryProblem:
      description: RFC 9457 problem details of a change of an entry, with the stable reason in `code`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: |
                `assigning`: another tab holds the entry (RF-26). `copying`: a file of the entry is still being
                copied (RF-27).
              enum: [assigning, copying]
    TitleKind:
      type: string
      description: A movie (Movies/) or a series (TV Shows/), spec §2.
      enum: [movie, series]
    TitleSource:
      type: string
      description: |
        Where a title comes from: the library (`library`), TMDB (`tmdb`), or a name typed by the
        user (`free`, spec §6).
      enum: [library, tmdb, free]
    DuplicateDecision:
      type: string
      description: |
        The answer to a duplicate (RF-24): `replace` sends the file that is there to the trash,
        `keep_both` keeps it as a version with its label, `skip` leaves the new file in No asignados.
        `keep_both` is not allowed when parts and versions are involved (RF-22).
      enum: [replace, keep_both, skip]
    TitleChoice:
      type: object
      description: The title a video goes to (RF-21). Which fields apply depends on `source`.
      required: [source]
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/TitleSource'
        libraryTitleId:
          type: integer
          format: int64
          minimum: 1
          description: The title of the library (`library`).
        tmdbId:
          type: integer
          format: int64
          minimum: 1
          description: The TMDB title (`tmdb`).
        kind:
          $ref: '#/components/schemas/TitleKind'
        title:
          type: string
          maxLength: 255
          description: The name of a free title (`free`); the title of the disc, which is not renamed by TMDB.
        year:
          type: integer
          minimum: 1
          maximum: 9999
          description: The year of a free title (`free`); omitted when unknown.
    AssignVideo:
      type: object
      description: |
        What one video of the entry becomes (RF-22). `place` puts it in a title: a movie takes a
        part, or the whole movie when `part` is omitted; a series takes a season (0 holds the
        specials), a chapter and, for a file with several chapters, the last one. `keep` is "No
        guardar": the video stays in No asignados.
      required: [file, action]
      additionalProperties: false
      properties:
        file:
          type: string
          maxLength: 1024
          description: |
            The file inside the entry, with "/" separators, as the suggestions name it. Empty for a
            loose entry, which is one file. The server takes it from the entry; no path is built from it.
        action:
          type: string
          enum: [place, keep]
        title:
          $ref: '#/components/schemas/TitleChoice'
        part:
          type: integer
          minimum: 1
          maximum: 999
        season:
          type: integer
          minimum: 0
          maximum: 999
        chapter:
          type: integer
          minimum: 1
          maximum: 999
        lastChapter:
          type: integer
          minimum: 1
          maximum: 999
          description: The last chapter of a file with several consecutive chapters (RF-22).
        chapterTitle:
          type: string
          maxLength: 255
          description: The chapter's title for a free series (spec §6); omitted when it has none.
        version:
          type: string
          maxLength: 255
          description: The label of a version kept with `keep_both` (RF-24), as the user edited it.
        duplicate:
          $ref: '#/components/schemas/DuplicateDecision'
    AssignSubtitle:
      type: object
      description: 'What one subtitle of the entry becomes (RF-23): the video it goes with, its language and its flags.'
      required: [file, language]
      additionalProperties: false
      properties:
        file:
          type: string
          maxLength: 1024
        video:
          type: string
          maxLength: 1024
          description: The video of the entry it goes with. Omitted when it goes with none.
        language:
          type: string
          minLength: 2
          maxLength: 16
          description: ISO 639-1 with an optional region, as spec §5 writes it (`es`, `en`, `es-419`).
        forced:
          type: boolean
        sdh:
          type: boolean
    AssignRequest:
      type: object
      description: The choices of the form for an entry (RF-22, RF-23, RF-24). Every video and subtitle of the entry needs one.
      required: [videos, subtitles]
      additionalProperties: false
      properties:
        videos:
          type: array
          items:
            $ref: '#/components/schemas/AssignVideo'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/AssignSubtitle'
        labels:
          type: array
          description: |
            The labels written for the versions that already hold the place of a video and have no
            readable label of their own (RF-24). Only with "keep both"; the plan says which need one.
          items:
            $ref: '#/components/schemas/AssignLabel'
    AssignLabel:
      type: object
      description: The label the user wrote for an old version, as the plan names it (RF-24).
      required: [rel, version]
      additionalProperties: false
      properties:
        rel:
          type: string
          maxLength: 1024
          description: The path of the old version inside the library, as the plan lists it in its duplicates.
        version:
          type: string
          minLength: 1
          maxLength: 255
          description: The label. It is cleaned like the label of the new video; the new one takes " (2)" if they collide.
    TitleHit:
      type: object
      description: 'A title that an assignment can take (RF-21): a title of the library, or a TMDB title.'
      required: [source, kind, title]
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/TitleSource'
        libraryTitleId:
          type: integer
          format: int64
          description: The title of the library; for a TMDB result, set when the library already has it.
        tmdbId:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/TitleKind'
        title:
          type: string
        year:
          type: integer
          minimum: 1
          maximum: 9999
        posterFile:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}\.(jpe?g|png)$'
          description: The poster's file for `GET /images/poster/{file}`; omitted when there is none.
    LibraryScope:
      type: object
      description: |
        What a move or a trash takes from a title (RF-44): the whole title (`title`), one season (`season`,
        with its number; 0 holds the specials), or one video with its subtitles (`file`, with its `fileId`).
        A movie's part or version is a file.
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [title, season, file]
        season:
          type: integer
          minimum: 0
          maximum: 999
          description: Required for `season`.
        fileId:
          type: integer
          format: int64
          minimum: 1
          description: 'Required for `file`: a video of the title, as the title page lists it.'
    EditProblem:
      description: RFC 9457 problem details of an edit, with the stable reason in `code`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: '`plan_changed`: the title changed since the plan was made; the plan is checked again (RF-25).'
              enum: [plan_changed]
    IDTagRequest:
      type: object
      description: 'The ID tag action of a title (RF-45): the tag the title takes, checked against the revision of its plan. The answers to the duplicates (RF-24) and the labels of the versions go with it, as in an edit; a video that is not listed keeps its choices.'
      required: [revision, idTag]
      additionalProperties: false
      properties:
        revision:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The revision of the title that the plan answered (RF-25). A commit with another one is `plan_changed`.
        idTag:
          type: boolean
          description: '`true` puts the tag [tmdbid-ID] on the title (its folder, and the files of a movie); `false` takes it off.'
        videos:
          type: array
          items:
            $ref: '#/components/schemas/IDTagVideo'
        labels:
          type: array
          description: The labels written for the old versions that need one (RF-24), as the plan names them.
          items:
            $ref: '#/components/schemas/AssignLabel'
    IDTagVideo:
      type: object
      description: 'The answer of the form to a video of the title in the ID tag action (RF-24): its label as a version, and its answer to a duplicate of its place. The place and the names of the file are not chosen here.'
      required: [fileId]
      additionalProperties: false
      properties:
        fileId:
          type: integer
          format: int64
          minimum: 1
          description: The video of the title, as the title page lists it (`GET /library/titles/{id}`).
        version:
          type: string
          maxLength: 255
          description: The label of the version (RF-24). Empty keeps the label the video has.
        duplicate:
          $ref: '#/components/schemas/DuplicateDecision'
    EditRequest:
      type: object
      description: |
        The choices of the edit form for a title (RF-44): its new identity (`title`: a title of the library the
        files join, a TMDB title, or a free name), the place and version of each video, the language and flags
        of each subtitle, and the labels of the old versions that need one (RF-24). Every video and subtitle of
        the title needs a choice; the server takes every path from the registry and from spec §5.
      required: [revision, title, videos, subtitles]
      additionalProperties: false
      properties:
        revision:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The revision of the title that the plan answered (RF-25). A commit with another one is `plan_changed`.
        title:
          $ref: '#/components/schemas/TitleChoice'
        videos:
          type: array
          items:
            $ref: '#/components/schemas/EditVideo'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/EditSubtitle'
        labels:
          type: array
          description: The labels written for the old versions that need one (RF-24), as the plan names them.
          items:
            $ref: '#/components/schemas/AssignLabel'
    EditVideo:
      type: object
      description: |
        What one video of the title becomes (RF-22, RF-44). A movie takes a part (0 for the whole movie); a series
        takes a season, a chapter and, for a file with several chapters, the last one. `chapterTitle` is the title
        of a chapter of a free series (it is read from the name on the disk when the title is opened).
      required: [fileId]
      additionalProperties: false
      properties:
        fileId:
          type: integer
          format: int64
          minimum: 1
          description: The video of the title, as the title page lists it (`GET /library/titles/{id}`).
        part:
          type: integer
          minimum: 0
          maximum: 999
        season:
          type: integer
          minimum: 0
          maximum: 999
        chapter:
          type: integer
          minimum: 1
          maximum: 999
        lastChapter:
          type: integer
          minimum: 1
          maximum: 999
        chapterTitle:
          type: string
          maxLength: 255
        version:
          type: string
          maxLength: 255
          description: The label of the version (RF-24); empty for the only file of its place.
        duplicate:
          $ref: '#/components/schemas/DuplicateDecision'
    EditSubtitle:
      type: object
      description: 'What one subtitle of the title becomes (RF-23): its language and its flags. It goes with its video.'
      required: [fileId, language]
      additionalProperties: false
      properties:
        fileId:
          type: integer
          format: int64
          minimum: 1
        language:
          type: string
          minLength: 2
          maxLength: 16
          description: ISO 639-1 with an optional region, as spec §5 writes it (`es`, `en`, `es-419`).
        forced:
          type: boolean
        sdh:
          type: boolean
    EditPlan:
      type: object
      description: |
        The preview of an edit (RF-44). It changes nothing. `valid` is true when the same request can be committed;
        `errors` say what stops it and `warnings` what does not.
      required: [titleId, revision, valid, kind, title, folder, videos, subtitles, errors, warnings]
      additionalProperties: false
      properties:
        titleId:
          type: integer
          format: int64
        revision:
          type: string
          description: The revision the commit must send back (RF-25).
        valid:
          type: boolean
        kind:
          $ref: '#/components/schemas/TitleKind'
        title:
          type: string
          description: The name of the title after the edit (its disc title, or the title of the library it joins).
        folder:
          type: string
          description: The title's folder after the edit, inside the library, with "/" separators.
        mergeInto:
          type: integer
          format: int64
          description: The title of the library the files join when the edit joins another title (RF-44); omitted otherwise.
        videos:
          type: array
          items:
            $ref: '#/components/schemas/EditPlanVideo'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/EditPlanSubtitle'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PlanIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlanIssue'
    EditPlanVideo:
      type: object
      description: A video of the title in the preview (RF-24, RF-44).
      required: [fileId, file, changed, duplicates, exactCopy, allowed]
      additionalProperties: false
      properties:
        fileId:
          type: integer
          format: int64
        file:
          type: string
          description: Its path inside the library now.
        finalPath:
          type: string
          description: Its path inside the library after the edit (spec §5); the same as `file` when it stays. Omitted while a duplicate waits for its answer (RF-24), as in the assignment preview.
        changed:
          type: boolean
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/PlanDuplicate'
        exactCopy:
          type: boolean
        allowed:
          type: array
          description: The answers that a duplicate accepts. Empty without a duplicate.
          items:
            $ref: '#/components/schemas/DuplicateDecision'
        proposal:
          $ref: '#/components/schemas/DuplicateDecision'
        decision:
          $ref: '#/components/schemas/DuplicateDecision'
        version:
          type: string
        versionProposal:
          type: string
        versionIncomplete:
          type: boolean
    EditPlanSubtitle:
      type: object
      required: [fileId, file, changed]
      additionalProperties: false
      properties:
        fileId:
          type: integer
          format: int64
        file:
          type: string
        finalPath:
          type: string
          description: Omitted while the video it goes with waits for its answer to a duplicate (RF-24).
        changed:
          type: boolean
    EditResult:
      type: object
      description: 'What an edit did (RF-44): the title it ended in, its folder, and whether it joined another title.'
      required: [titleId, folder, merged, changed]
      additionalProperties: false
      properties:
        titleId:
          type: integer
          format: int64
        folder:
          type: string
        merged:
          type: boolean
        changed:
          type: boolean
          description: False when the edit changed nothing.
    LibraryTitles:
      type: object
      required: [titles]
      additionalProperties: false
      properties:
        titles:
          type: array
          items:
            $ref: '#/components/schemas/LibraryTitleSummary'
    LibraryTitleSummary:
      type: object
      required: [id, kind, title, year, idTag]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: '#/components/schemas/TitleKind'
        title:
          type: string
          description: The title the user sees (the TMDB title, or the free name).
        year:
          type: integer
          minimum: 0
          maximum: 9999
          description: The year of the premiere or of the first broadcast; 0 when unknown.
        tmdbId:
          type: integer
          format: int64
          minimum: 1
          description: The TMDB id of a linked title; omitted for a free title.
        idTag:
          type: boolean
          description: Whether the tag [tmdbid-ID] is on in the folder and the files (RF-45).
    LibraryTitle:
      type: object
      description: A title of the library with its videos (RF-43).
      required: [id, kind, title, discTitle, year, idTag, videos]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: '#/components/schemas/TitleKind'
        title:
          type: string
        discTitle:
          type: string
          description: The disc title <T> of spec §5, the name of its folder and files.
        year:
          type: integer
          minimum: 0
          maximum: 9999
        tmdbId:
          type: integer
          format: int64
          minimum: 1
          description: The TMDB id of a linked title; omitted for a free title.
        idTag:
          type: boolean
        poster:
          type: string
          description: The poster file name that `/api/images/poster/{file}` serves; omitted when there is none.
        videos:
          type: array
          items:
            $ref: '#/components/schemas/LibraryVideo'
    LibraryVideo:
      type: object
      description: A video of the title, with its subtitles. A movie has a part (0 for the whole movie); a series, a season and chapters.
      required: [id, path, size, version, part, subtitles]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        path:
          type: string
          description: The path inside the library, with "/" separators (for display only; the server builds every path).
        size:
          type: integer
          format: int64
          minimum: 0
        version:
          type: string
          description: The label of a version (RF-24); empty for the only file of its place.
        part:
          type: integer
          minimum: 0
          maximum: 999
        season:
          type: integer
          minimum: 0
          maximum: 999
          description: The season of a chapter (0 holds the specials); omitted for a movie.
        chapter:
          type: integer
          minimum: 1
          maximum: 999
        lastChapter:
          type: integer
          minimum: 1
          maximum: 999
        chapterTitle:
          type: string
          description: The title of a chapter of a free series, read from its name (spec §6); omitted otherwise.
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/LibrarySubtitle'
    LibrarySubtitle:
      type: object
      required: [id, path, language, forced, sdh]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        path:
          type: string
        language:
          type: string
          description: The language of spec §5 (`es`, `es-419`, `en`).
        forced:
          type: boolean
        sdh:
          type: boolean
    LibraryFileTechnical:
      type: object
      description: Technical information of a video file in the library (RF-44).
      required: [path, size, readable, duration, video, audio, subtitles]
      additionalProperties: false
      properties:
        path:
          type: string
          description: The path relative to the library dataset, with "/" separators.
        size:
          type: integer
          format: int64
          minimum: 0
          description: The registered file size in bytes.
        readable:
          type: boolean
          description: Whether ffprobe could read the file and provide its technical information.
        duration:
          type: number
          format: double
          minimum: 0
          description: Duration in seconds; zero when ffprobe could not read it or did not report one.
        video:
          $ref: '#/components/schemas/TechnicalVideo'
        audio:
          type: array
          items:
            $ref: '#/components/schemas/TechnicalAudio'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/TechnicalSubtitle'
    TechnicalVideo:
      type: object
      required: [width, height, hdr, codec]
      additionalProperties: false
      properties:
        width:
          type: integer
          minimum: 0
        height:
          type: integer
          minimum: 0
        hdr:
          type: boolean
        codec:
          type: string
    TechnicalAudio:
      type: object
      required: [codec, channels, language, title, default]
      additionalProperties: false
      properties:
        codec:
          type: string
        channels:
          type: integer
          minimum: 0
        language:
          type: string
        title:
          type: string
        default:
          type: boolean
    TechnicalSubtitle:
      type: object
      required: [codec, language, title, forced, sdh, default]
      additionalProperties: false
      properties:
        codec:
          type: string
        language:
          type: string
        title:
          type: string
        forced:
          type: boolean
        sdh:
          type: boolean
        default:
          type: boolean
    TitleSearch:
      type: object
      required: [tmdbAvailable, library, tmdb]
      additionalProperties: false
      properties:
        tmdbAvailable:
          type: boolean
          description: False when TMDB is not configured or did not answer.
        library:
          type: array
          description: The titles of the library that match, sorted by title (RF-21).
          items:
            $ref: '#/components/schemas/TitleHit'
        tmdb:
          type: array
          description: The TMDB movies, then the series, that match.
          items:
            $ref: '#/components/schemas/TitleHit'
    NameReading:
      type: object
      description: What a file name, and its folders, say about the file (RF-20, RF-23). Absent fields are not known.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [movie, series, unknown]
          description: '`unknown` when the name does not say (absolute numbering, a generic name, §8).'
        title:
          type: string
        year:
          type: integer
          minimum: 1
          maximum: 9999
        season:
          type: integer
          minimum: 0
          maximum: 999
        chapter:
          type: integer
          minimum: 1
          maximum: 999
        lastChapter:
          type: integer
          minimum: 1
          maximum: 999
        part:
          type: integer
          minimum: 1
          maximum: 999
        language:
          type: string
        forced:
          type: boolean
        sdh:
          type: boolean
    VideoSuggestion:
      type: object
      required: [file, reading]
      additionalProperties: false
      properties:
        file:
          type: string
        reading:
          $ref: '#/components/schemas/NameReading'
        match:
          description: The best TMDB match for the title the name gives; omitted when TMDB is not configured or finds none.
          allOf:
            - $ref: '#/components/schemas/TitleHit'
    SubtitleSuggestion:
      type: object
      required: [file, language, forced, sdh]
      additionalProperties: false
      properties:
        file:
          type: string
        language:
          type: string
          description: The language the name gives, or es-419 when it gives none (RF-23).
        forced:
          type: boolean
        sdh:
          type: boolean
        video:
          type: string
          description: The video the name shares with it; omitted when none is named.
    AssignSuggestions:
      type: object
      description: The starting point of the assignment of an entry (RF-20, RF-23).
      required: [entryId, name, relation, tmdbConfigured, videos, subtitles]
      additionalProperties: false
      properties:
        entryId:
          type: integer
          format: int64
        name:
          type: string
          description: The name of the entry in No asignados.
        relation:
          $ref: '#/components/schemas/BatchRelation'
        tmdbConfigured:
          type: boolean
        title:
          description: For a relation of chapters (RF-03), the series that its chapters match. Omitted otherwise.
          allOf:
            - $ref: '#/components/schemas/TitleHit'
        videos:
          type: array
          items:
            $ref: '#/components/schemas/VideoSuggestion'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleSuggestion'
    PlanIssue:
      type: object
      description: One thing that the choices get wrong (RF-22, RF-24, RF-25). The UI translates `code` with i18n keys.
      required: [field, code]
      additionalProperties: false
      properties:
        file:
          type: string
          description: The file the issue is about; omitted when it is about the entry.
        field:
          type: string
          description: The field of the choice, such as `title`, `season`, `duplicate`, `version`, `video` or `file`.
        target:
          type: string
          description: The path inside the library of the old version the issue is about, when it is about one.
        code:
          type: string
          description: |
            A stable reason, such as `missing`, `unknown`, `required`, `invalid`, `in_library`,
            `tmdb_unavailable`, `not_allowed`, `incomplete`, `duplicate_target`, `parts_and_whole`,
            `chapters_overlap`, `mismatch`, `not_needed` (a label for a version that needs none), or
            `invalid` (a label with nothing usable in it).
    PlanDuplicate:
      type: object
      description: A video that already holds the place of a planned video (RF-24).
      required: [rel, size]
      additionalProperties: false
      properties:
        rel:
          type: string
          description: The path of the video inside the library.
        size:
          type: integer
          format: int64
        version:
          type: string
          description: The label of the video, when it has one.
        versionProposal:
          type: string
          description: The label the rule proposes for this version when both versions are kept (RF-24).
        versionNeeded:
          type: boolean
          description: True when the rule cannot name this version and the user must write its label (RF-24).
    PlanVideo:
      type: object
      description: A video of the entry in the preview (RF-25).
      required: [file, keep, duplicates, exactCopy, allowed]
      additionalProperties: false
      properties:
        file:
          type: string
        keep:
          type: boolean
          description: True for "No guardar" (RF-22).
        finalPath:
          type: string
          description: The path inside the library once placed (spec §5); omitted when the video stays in No asignados.
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/PlanDuplicate'
        exactCopy:
          type: boolean
          description: True when a duplicate has the same content (RF-24).
        allowed:
          type: array
          description: The answers that a duplicate accepts. Empty without a duplicate.
          items:
            $ref: '#/components/schemas/DuplicateDecision'
        proposal:
          $ref: '#/components/schemas/DuplicateDecision'
        decision:
          $ref: '#/components/schemas/DuplicateDecision'
        version:
          type: string
          description: The label that a version kept with `keep_both` takes.
        versionProposal:
          type: string
          description: The label that the rule proposes for the new version (RF-24).
        versionIncomplete:
          type: boolean
          description: True when the proposed label cannot name a part that tells the versions apart; the user writes it (RF-24).
    PlanSubtitle:
      type: object
      description: A subtitle of the entry in the preview (RF-23).
      required: [file, video]
      additionalProperties: false
      properties:
        file:
          type: string
        video:
          type: string
          description: The video it goes with; empty when none.
        finalPath:
          type: string
          description: Its path inside the library, next to its video (spec §5); omitted when it stays in No asignados.
    AssignPlan:
      type: object
      description: |
        The preview of the choices of an entry (RF-25). It changes nothing. `valid` is true when the
        choices can be committed; `errors` say what stops them and `warnings` what does not (RF-22).
      required: [entryId, valid, videos, subtitles, errors, warnings]
      additionalProperties: false
      properties:
        entryId:
          type: integer
          format: int64
        valid:
          type: boolean
        videos:
          type: array
          items:
            $ref: '#/components/schemas/PlanVideo'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/PlanSubtitle'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PlanIssue'
        warnings:
          type: array
          description: Things that do not stop the commit, such as a season or a chapter that TMDB does not know (RF-22).
          items:
            $ref: '#/components/schemas/PlanIssue'
    PlacedFile:
      type: object
      required: [file, path]
      additionalProperties: false
      properties:
        file:
          type: string
        path:
          type: string
          description: The path inside the library, with "/" separators.
    AssignResult:
      type: object
      description: What a commit did (RF-25, RF-26).
      required: [entryId, entryRemoved, placed]
      additionalProperties: false
      properties:
        entryId:
          type: integer
          format: int64
        entryRemoved:
          type: boolean
          description: True when nothing is left in the entry, which disappears (RF-26).
        placed:
          type: array
          items:
            $ref: '#/components/schemas/PlacedFile'
