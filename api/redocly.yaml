# Redocly CLI configuration for api/openapi.yaml (`task lint:openapi` and the CI job).
# Every rule of the recommended set applies. One exception is recorded in
# api/.redocly.lint-ignore.yaml: /health always answers 200 by design (liveness
# must answer), so it has no 4XX response.
extends:
  - recommended

# Anonymous usage telemetry off: the linter runs in a container on every check.
telemetry: off
