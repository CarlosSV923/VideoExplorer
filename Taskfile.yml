version: '3'

# Optional local overrides (ignored when missing).
dotenv: ['.env.local']

vars:
  API_DIR: apps/api
  # Go toolchain (same version as apps/api/go.mod) + official 7-Zip and ffprobe
  # (deploy/dev/Dockerfile); built by dev:image.
  # Go tooling runs in Docker: identical to CI on every OS, and avoids Windows
  # Application Control blocking freshly compiled Go binaries.
  GO_IMAGE: videoexplorer-dev:1
  # Official golangci-lint image (v2), same version as the CI lint job.
  LINT_IMAGE: golangci/golangci-lint:v2.14.0
  # Official Redocly CLI image (entrypoint `redocly`), used to lint api/openapi.yaml.
  REDOCLY_IMAGE: redocly/cli:2.62.1
  # Official sqlc image, same version as the CI check of the generated code.
  SQLC_IMAGE: sqlc/sqlc:1.31.1
  # Same version as @playwright/test in apps/web.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
  # Latest stable govulncheck; the same version runs in CI.
  GOVULNCHECK_VERSION: v1.8.0
  DOCKER_GO: >-
    docker run --rm -v "{{.ROOT_DIR}}:/src" -v ve-gomod:/go/pkg/mod
    -v ve-gocache:/root/.cache/go-build -w /src/{{.API_DIR}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    deps: [dev:image]
    desc: Install JS dependencies and download Go modules
    cmds:
      - pnpm install --frozen-lockfile
      - '{{.DOCKER_GO}} {{.GO_IMAGE}} go mod download'

  tidy:
    deps: [dev:image]
    desc: go mod tidy (in Docker)
    cmds:
      - '{{.DOCKER_GO}} {{.GO_IMAGE}} go mod tidy'

  hash-password:
    deps: [dev:image]
    desc: 'Hash a password for APP_PASSWORD_HASH (usage: echo "pw" | task hash-password)'
    interactive: true
    cmds:
      - docker run --rm -i -v "{{.ROOT_DIR}}:/src" -v ve-gomod:/go/pkg/mod -v ve-gocache:/root/.cache/go-build -w /src/{{.API_DIR}} {{.GO_IMAGE}} go run ./cmd/videoexplorer hash-password

  # ---------- development ----------
  dev:image:
    desc: Build the dev/test image (Go + official 7-Zip + ffprobe)
    run: once
    cmds:
      - docker build -t {{.GO_IMAGE}} -f deploy/dev/Dockerfile .
    sources:
      - deploy/dev/Dockerfile
      - scripts/install-7zip.sh
      - scripts/install-ffprobe.sh
    status:
      - docker image inspect {{.GO_IMAGE}} >/dev/null 2>&1

  dev:api:
    deps: [dev:image]
    desc: Run the Go API in Docker (http://localhost:8080) with the variables of .env.local
    cmds:
      # Development stand-ins for LIBRARY_PATH and DATA_PATH: both must exist and be
      # writable for /api/health to answer ok from the first run (RF-63).
      - mkdir -p .dev/library .dev/data
      - docker compose -f compose.dev.yaml up api

  dev:web:
    desc: Run the Vite dev server (http://localhost:5173), proxying /api to the Go API
    cmds:
      - pnpm dev:web

  spike:library:
    desc: Generate the throwaway Jellyfin naming library in .dev/spike-library (needs Docker and Git Bash)
    cmds:
      - bash scripts/spike/make-library.sh

  spike:jellyfin:up:
    desc: Start the local Jellyfin 12.2 (same as the NAS) on http://localhost:8096 with the spike library read-only (needs Docker and Git Bash)
    cmds:
      - bash scripts/spike/jellyfin.sh up

  spike:jellyfin:down:
    desc: Stop and remove the spike Jellyfin container (keeps its config)
    cmds:
      - bash scripts/spike/jellyfin.sh down

  spike:jellyfin:reset:
    desc: Stop the spike Jellyfin container and delete its config and cache in .dev/spike-jellyfin
    cmds:
      - bash scripts/spike/jellyfin.sh reset

  demo-catalog:
    deps: [dev:image]
    desc: Regenerate the demo's fixed TMDB catalog (structure only; needs TMDB_READ_TOKEN or TMDB_API_KEY in .env.local)
    cmds:
      # Only the TMDB credentials reach the container; the generator uses the read token when both are set.
      - '{{.DOCKER_GO}} -e TMDB_READ_TOKEN -e TMDB_API_KEY {{.GO_IMAGE}} go run ./cmd/demo-catalog'

  # ---------- code generation ----------
  gen:
    desc: Regenerate code from api/openapi.yaml and the SQL queries
    cmds:
      - task: gen:api
      - task: gen:sql

  gen:api:
    deps: [dev:image]
    desc: Go server types (oapi-codegen, in Docker) and TS client types (openapi-typescript) from api/openapi.yaml
    cmds:
      - '{{.DOCKER_GO}}/internal/platform/httpapi {{.GO_IMAGE}} go tool oapi-codegen -config oapi-codegen.yaml ../../../../../api/openapi.yaml'
      - pnpm gen:web

  gen:sql:
    desc: Typed Go queries from SQL (sqlc, in Docker)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}/{{.API_DIR}}:/src" -w /src {{.SQLC_IMAGE}} generate

  # ---------- quality ----------
  lint:
    desc: Lint the OpenAPI contract, Go and TypeScript code
    cmds:
      - task: lint:openapi
      - task: lint:api
      - task: lint:web

  fmt:
    desc: Format Go (gofumpt + goimports) and TS/JSON/YAML (Prettier)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -v ve-gomod:/go/pkg/mod -v ve-lintcache:/root/.cache -w /src/{{.API_DIR}} {{.LINT_IMAGE}} golangci-lint fmt ./...
      - pnpm format

  lint:openapi:
    desc: Redocly CLI lint of api/openapi.yaml (in Docker; rules in api/redocly.yaml)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/spec" -w /spec {{.REDOCLY_IMAGE}} lint --config api/redocly.yaml api/openapi.yaml

  lint:api:
    desc: golangci-lint v2 (in Docker; config in apps/api/.golangci.yml)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -v ve-gomod:/go/pkg/mod -v ve-lintcache:/root/.cache -w /src/{{.API_DIR}} {{.LINT_IMAGE}} golangci-lint run ./...

  lint:web:
    desc: ESLint, type check and Prettier check of the web app
    cmds:
      - pnpm lint:web
      - pnpm typecheck:web
      - pnpm format:check

  test:
    desc: Run all tests
    cmds:
      - task: test:api
      - task: test:web

  test:api:
    deps: [dev:image]
    desc: Go tests with the race detector (in Docker)
    cmds:
      - '{{.DOCKER_GO}} {{.GO_IMAGE}} go test -race -count=1 -timeout 300s ./...'

  test:web:
    desc: Vitest + Testing Library
    cmds:
      - pnpm test:web

  vuln:
    deps: [dev:image]
    desc: Known vulnerabilities in the Go dependencies (govulncheck, pinned, in Docker)
    cmds:
      - '{{.DOCKER_GO}} {{.GO_IMAGE}} go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...'

  # ---------- build ----------
  build:web:
    desc: Build the SPA (apps/web/dist)
    cmds:
      - pnpm build:web

  build:demo:
    desc: Build the SPA with the backend-less demo adapters
    env:
      VITE_DATA_SOURCE: demo
    cmds:
      - pnpm build:web

  e2e:
    desc: End-to-end tests of the demo build (Playwright in Docker; desktop and touch mobile)
    cmds:
      - >-
        docker run --rm --ipc=host -e CI=1 -v "{{.ROOT_DIR}}:/src" -v /src/node_modules -v /src/apps/web/node_modules
        -w /src {{.PLAYWRIGHT_IMAGE}}
        sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @videoexplorer/web exec playwright install chromium && pnpm e2e:web"

  embed:web:
    internal: true
    cmds:
      - node -e "const fs=require('fs');const d='{{.API_DIR}}/internal/platform/web/dist';for(const f of fs.readdirSync(d))if(f!=='.gitkeep')fs.rmSync(d+'/'+f,{recursive:true});fs.cpSync('apps/web/dist',d,{recursive:true})"

  build:api:
    deps: [dev:image]
    desc: Build the Linux Go binary (apps/api/bin/videoexplorer, in Docker)
    cmds:
      - '{{.DOCKER_GO}} -e CGO_ENABLED=0 {{.GO_IMAGE}} go build -trimpath -o bin/videoexplorer ./cmd/videoexplorer'

  build:
    desc: Build the SPA, embed it in the Go code and build the Linux binary with the SPA inside
    cmds:
      - task: build:web
      - task: embed:web
      - task: build:api

  # ---------- everything CI runs ----------
  check:
    desc: Everything CI runs except the generated-code check, which is CI-only (lint, tests, vulnerability check, builds)
    cmds:
      - task: lint
      - task: test
      - task: vuln
      - task: build
