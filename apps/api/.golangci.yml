version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          # Test helpers close response bodies through t.Cleanup, which bodyclose cannot see.
          - bodyclose
      - path: internal/platform/httpapi/gen\.go
        linters:
          - revive
          - gocritic
          - errorlint
          - unparam

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/CarlosSV923/VideoExplorer
